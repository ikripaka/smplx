[package]
name = "simplex_fixtures"
edition = "2024"
rust-version = "1.91.0"
version = "0.1.0"

[profile.dev.package."*"]
opt-level = 3

[dependencies]
smplx-std = { path = "../crates/simplex" }

anyhow = { version = "1.0.104" }

[dev-dependencies]
serde_json = { version = "1.0.154" }

# Same as the Simplex workspace: `[patch]` applies only to the workspace being built.
[patch.crates-io]
simplicityhl = { git = "https://github.com/ikripaka/SimplicityHL.git", branch = "feat/simplicity-support" }
